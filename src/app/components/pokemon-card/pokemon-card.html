@let p = pokemon();
<div class="cardFlipper" [class.flipped]="flipped()" (dblclick)="flipped.set(!flipped())">
  <!-- card front -->
  <div class="cardFront">
    <div class="lvl">Lv {{ p.lvl }}</div>
    <div class="name">{{ p.name }}</div>
    <div class="hp"><i class="fa-solid fa-heart" aria-hidden="true"></i> {{ p.currentHP }}</div>
    <div class="picContainer">
      <div class="picBox">
        <div class="sky"></div>
        <div class="ground"></div>
        <div class="pokemonPic">
          <img [src]="'/assets/pics/front/' + p.id + '.png'" [alt]="p.name" />
        </div>
      </div>
    </div>
    <div class="footerBorder"></div>
    <div class="pokeAttrib atk">
      <div class="attribLogo"><i class="icon-red fa-regular fa-hand-back-fist" aria-hidden="true"></i></div>
      <div class="attribNumber"><span>{{ p.atk }}</span></div>
    </div>
    <div class="pokeAttrib spd">
      <div class="attribLogo"><i class="icon-yellow fa-solid fa-bolt" aria-hidden="true"></i></div>
      <div class="attribNumber"><span>{{ p.spd }}</span></div>
    </div>
    <div class="pokeAttrib def">
      <div class="attribLogo"><i class="icon-blue fa-solid fa-shield" aria-hidden="true"></i></div>
      <div class="attribNumber"><span>{{ p.def }}</span></div>
    </div>
  </div>

  <!-- card back -->
  <div class="cardBack">
    <div class="info">
      <h5>Moves:</h5>
      @for (move of p.moves; track move.name) {
        <div>
          <p>
            <b>{{ move.name | capitalize }} - </b>
            {{ move.text }}
          </p>
        </div>
      }
      <h5>Ability:</h5>
      <p>
        <b>{{ p.abilities[0]?.name | capitalize }} - </b>
        {{ p.abilities[0]?.text }}
      </p>
    </div>
  </div>
</div>
